<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1b2e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="alertGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f1f5f9;
    }
    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #64748b;
    }

    /* Subtle background grid and particle animations */
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pingDot {
      0% { r: 4px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes alertBadgePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    .bg-pulse-1 {
      animation: pulseCircle 8s ease-in-out infinite;
      transform-origin: 1050px 90px;
    }
    .bg-pulse-2 {
      animation: pulseCircle 10s ease-in-out infinite reverse;
      transform-origin: 150px 250px;
    }
    .animated-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 3s linear infinite;
    }
    .floating-card-1 {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatParticle 7s ease-in-out infinite 1s;
    }
    .ping-circle {
      animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .alert-glow-pulse {
      animation: alertBadgePulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle class="bg-pulse-1" cx="1050" cy="90" r="140" fill="#38bdf8" filter="url(#pulseGlow)" />
  <circle class="bg-pulse-2" cx="150" cy="270" r="160" fill="#818cf8" filter="url(#pulseGlow)" />

  <!-- Dynamic Dispatch Flow (Right Side Visuals) -->
  <g opacity="0.85">
    <!-- Connecting Workflow Circuit Lines -->
    <path class="animated-dash" d="M 820 170 C 880 170, 880 100, 940 100" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="animated-dash" d="M 820 170 C 880 170, 880 170, 940 170" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <path class="animated-dash" d="M 820 170 C 880 170, 880 240, 940 240" fill="none" stroke="#f43f5e" stroke-width="2.5" />

    <!-- Trigger Event Node -->
    <g class="floating-card-1">
      <rect x="710" y="138" width="125" height="64" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="730" cy="170" r="6" fill="#f43f5e" />
      <circle class="ping-circle" cx="730" cy="170" r="6" fill="#f43f5e" />
      <text x="746" y="166" class="card-label">CI Trigger</text>
      <text x="746" y="182" class="card-sub">Test Failure Alert</text>
    </g>

    <!-- Target Output 1: Incident / Pager -->
    <g class="floating-card-2">
      <rect x="940" y="68" width="180" height="54" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1" />
      <rect x="952" y="83" width="24" height="24" rx="6" fill="#f43f5e" fill-opacity="0.2" />
      <text x="964" y="99" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🚨</text>
      <text x="986" y="93" class="card-label">On-Call Dispatch</text>
      <text x="986" y="108" class="card-sub">PagerDuty / Escalation</text>
    </g>

    <!-- Target Output 2: Team Collaboration -->
    <g class="floating-card-1">
      <rect x="940" y="143" width="180" height="54" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
      <rect x="952" y="158" width="24" height="24" rx="6" fill="#818cf8" fill-opacity="0.2" />
      <text x="964" y="174" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">💬</text>
      <text x="986" y="168" class="card-label">Chat &amp; Channels</text>
      <text x="986" y="183" class="card-sub">Slack • Teams • Telegram</text>
    </g>

    <!-- Target Output 3: Webhook / Automation Gate -->
    <g class="floating-card-2">
      <rect x="940" y="218" width="180" height="54" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
      <rect x="952" y="233" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2" />
      <text x="964" y="249" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="986" y="243" class="card-label">Quality Gates</text>
      <text x="986" y="258" class="card-sub">Webhooks • Auto Triage</text>
    </g>
  </g>

  <!-- Foreground Title and Content (Always crisp & in front) -->
  <g transform="translate(70, 75)">
    <!-- Top Category Pill -->
    <g>
      <rect width="215" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" class="badge-text">⚡ CI/CD &amp; QA OBSERVABILITY</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="80" class="title-text">
      Awesome Test Alerting &amp;
    </text>
    <text x="0" y="128" class="title-text" fill="url(#primaryGlow)">
      Notification Dispatch 🔔
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="172" class="subtitle-text">
      Curated platforms &amp; open-source engines for CI/CD test failure routing,
    </text>
    <text x="0" y="196" class="subtitle-text">
      smart escalations, quality gate webhooks, and on-call notification dispatch.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="112" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="56" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🚨 On-Call Alerts</text>

      <rect x="122" y="0" width="128" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="186" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔄 Auto-Escalation</text>

      <rect x="260" y="0" width="134" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="327" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📡 Multi-Channel API</text>

      <rect x="404" y="0" width="118" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="463" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ Quality Gates</text>
    </g>
  </g>
</svg>
